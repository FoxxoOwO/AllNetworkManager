name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Windows, .NET 10)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore AllNetworkManager.slnx

      - name: Build
        run: dotnet build AllNetworkManager.slnx -c Release --no-restore

      - name: Publish
        run: >
          dotnet publish AllNetworkManager.App/AllNetworkManager.App.csproj
          -c Release -r win-x64 --self-contained false
          -o publish

      - name: Verify the published binaries exist
        shell: pwsh
        run: |
          $exe = "publish/AllNetworkManager.App.exe"
          if (-not (Test-Path $exe)) { throw "expected $exe" }
          Get-ChildItem publish | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AllNetworkManager-win-x64
          path: publish/
          retention-days: 14

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained build
        run: >
          dotnet publish AllNetworkManager.App/AllNetworkManager.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o release/AllNetworkManager

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path release/AllNetworkManager/* -DestinationPath "release/AllNetworkManager-${{ github.ref_name }}-win-x64.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/AllNetworkManager-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true